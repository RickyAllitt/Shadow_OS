<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <title>Offline · Shadow OS</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: radial-gradient(circle at center, #111 0%, #000 100%); color: #fff;
               font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
        img { width: 96px; height: 96px; margin-bottom: 20px; }
        h1 { letter-spacing: 6px; color: #00eaff; text-shadow: 0 0 14px rgba(0, 234, 255, 0.6); margin: 0 0 12px; }
        p { color: #aaa; max-width: 320px; line-height: 1.5; margin: 0 auto 24px; }
        button { padding: 12px 28px; background: rgba(0, 234, 255, 0.1); border: 1px solid #00eaff; color: #00eaff;
                 letter-spacing: 3px; cursor: pointer; font-size: 0.9rem; }
    </style>
</head>

<body>
    <div>
        <img src="/static/icons/icon-192.png" alt="">
        <h1>NO SIGNAL</h1>
        <p>The System can't reach the server. Check your connection. Your streak is safe until the next reset.</p>
        <button onclick="location.reload()">RECONNECT</button>
    </div>
</body>

</html>
