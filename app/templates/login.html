{% extends "layout.html" %}

{% block content %}
<div class="login-div">
    <div class="panel login-panel">
        <h2 class="login-h2-system-login">SYSTEM LOGIN</h2>

        <form action="/login" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="login-div-2">
                <input class="login-input" type="text" name="username" placeholder="Hunter Name" required>
            </div>

            <div class="login-h2-system-login">
                <input class="login-input" type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn-complete login-button-access-system">ACCESS
                SYSTEM</button>
        </form>

        <p class="login-p-new-hunter">
            New Hunter? <a class="login-a-register-here" href="/register">Register Here</a>
        </p>
    </div>
</div>
{% endblock %}
