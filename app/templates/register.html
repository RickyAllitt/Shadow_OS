{% extends "layout.html" %}

{% block content %}
<div class="reg-div">
    <div class="panel reg-panel">
        <h2 class="reg-h2-hunter-registration">HUNTER REGISTRATION</h2>

        <form action="/register" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="timezone" id="registerTimezone" value="">
            <div class="reg-div-2">
                <input class="reg-input" type="text" name="username" placeholder="Hunter Name" required>
            </div>

            <div class="reg-div-2">
                <input class="reg-input" type="password" name="password" placeholder="Password" required>
            </div>

            <div class="reg-h2-hunter-registration">
                <input class="reg-input" type="password" name="confirm" placeholder="Confirm Password" required>
            </div>

            <button type="submit" class="btn-complete reg-button-initiate">INITIATE</button>
        </form>

        <p class="reg-p-already-registered">
            Already Registered? <a class="reg-a-login-here" href="/login">Login Here</a>
        </p>
    </div>
</div>
{% endblock %}
