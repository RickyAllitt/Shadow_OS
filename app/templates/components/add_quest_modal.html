<!-- Add Quest Modal -->
<div id="addQuestModal" class="modal addquest-overlay"
    style="display: none;">
    <div class="modal-content system-panel addquest-panel">

        <div class="addquest-header">
            <h2 class="addquest-title">INITIATE NEW
                PROTOCOL</h2>
            <span class="modal-close-x-sm" onclick="document.getElementById('addQuestModal').style.display='none'">&times;</span>
        </div>

        <form action="/add_quest" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-block-15">
                <label class="form-label">OBJECTIVE</label>
                <input class="addquest-input" type="text" name="title" placeholder="Enter task description..."

                    required>
            </div>

            <div class="form-block-15">
                <label class="form-label">DETAILS
                    (OPTIONAL)</label>
                <textarea class="addquest-textarea" name="description" placeholder="Additional context..."></textarea>
            </div>

            <div class="form-row-15">
                <div class="form-col">
                    <label class="form-label">START DATE
                        (OPTIONAL)</label>
                    <input class="addquest-date" type="datetime-local" name="start_date">
                </div>
                <div class="form-col">
                    <label class="form-label">DEADLINE
                        (OPTIONAL)</label>
                    <input class="addquest-date" type="datetime-local" name="due_date">
                </div>
            </div>

            <div class="form-row-15-loose">
                <div class="form-col">
                    <label class="form-label">DIFFICULTY
                        CLASS</label>
                    <select class="addquest-select" name="rank">
                        <option value="Auto">✨ AUTO DETECT</option>
                        <option value="E">Rank E (Trivial)</option>
                        <option value="D">Rank D (Easy)</option>
                        <option value="C">Rank C (Normal)</option>
                        <option value="B">Rank B (Hard)</option>
                        <option value="A">Rank A (Critical){{ ' · %d left this week' % rank_slots.A if rank_slots is defined }}</option>
                        <option value="S">Rank S (Life Changing){{ ' · %d left this week' % rank_slots.S if rank_slots is defined }}</option>
                    </select>
                </div>
                <div class="form-col">
                    <label class="form-label">ATTRIBUTE</label>
                    <select class="addquest-select" name="stat">
                        <option value="INT">INT (Mental)</option>
                        <option value="STR">STR (Physical)</option>
                        <option value="VIT">VIT (Health)</option>
                        <option value="AGI">AGI (Speed/Efficiency)</option>
                        <option value="SNS">SNS (Art/Social)</option>
                    </select>
                </div>
            </div>

            <!-- Priority Selection -->
            <div class="form-block-20">
                <label class="form-label">URGENCY
                    PRIORITY</label>
                <select class="addquest-select-lg" name="priority">
                    <option value="1">1 - CRITICAL (URGENT)</option>
                    <option value="2">2 - HIGH</option>
                    <option value="3">3 - MEDIUM</option>
                    <option value="4" selected>4 - LOW (DEFAULT)</option>
                </select>
            </div>

            <!-- Optional measurement: turns the quest into a tracked KPI -->
            <div class="form-block-20">
                <label class="form-label">MEASURE (OPTIONAL)</label>
                <div class="form-row-15 metric-row">
                    <input class="addquest-input" type="number" name="metric_target" min="0" step="any"
                        placeholder="Target, e.g. 50" inputmode="decimal">
                    <input class="addquest-input" type="text" name="metric_unit" maxlength="20"
                        placeholder="Unit, e.g. pushups">
                </div>
                <p class="metric-hint">Log amounts through the day; the quest completes when you hit the target.</p>
            </div>

            <div class="addquest-daily-row">
                <input class="addquest-checkbox" type="checkbox" name="is_daily" id="modal_is_daily_check">
                <label class="addquest-daily-label" for="modal_is_daily_check">Mark as Daily Protocol? (Repeats
                    every 24h)</label>
            </div>

            <button type="submit" class="btn-complete btn-addquest-submit">CONFIRM
                PROTOCOL</button>
        </form>
    </div>
</div>
